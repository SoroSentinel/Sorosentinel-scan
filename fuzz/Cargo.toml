[package]
name = "scan-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Separate workspace: cargo-fuzz needs nightly, the main build stays on stable.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
scan-core = { path = "../crates/scan-core" }
serde_json = "=1.0.154"

# One target per parser path (AGENTS.md §7b).
[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "known_bad_hashes"
path = "fuzz_targets/known_bad_hashes.rs"
test = false
doc = false
bench = false
