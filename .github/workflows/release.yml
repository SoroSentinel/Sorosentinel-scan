# Attaches prebuilt scan-cli binaries and SHA256SUMS to a GitHub release (#30).
#
# Runs when a release is published, or by hand for an existing tag. Uses the
# checkout action ci.yml already pins, rustup (which reads rust-toolchain.toml),
# the gh CLI on the runner, and actions/attest-build-provenance (approved
# 2026-11-02) to sign a SLSA build provenance attestation over every archive.
# Verify a download with:
#   gh attestation verify <archive> --repo SoroSentinel/Sorosentinel-scan
# The sandbox image push is not here yet: it needs a registry decision.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the tag: a bare name would resolve to a branch of the same
          # name first, letting unreviewed branch code be built under a tag
          # that passes the ancestry check below.
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag ancestry
        shell: bash
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          git fetch origin main
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo "Error: checked-out commit is not the commit tag $TAG points to" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Error: Tag $TAG is not an ancestor of origin/main" >&2
            exit 1
          }
      - run: rustup show active-toolchain
      - name: Build
        shell: bash
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          rustup target add "$TARGET"
          cargo build --locked --release -p scan-cli --target "$TARGET"
          dir="sorosentinel-scan_${TAG}_${TARGET}"
          mkdir -p "dist/$dir"
          cp "target/$TARGET/release/sorosentinel-scan" LICENSE README.md "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write SHA256SUMS over every attached binary archive
        run: |
          set -eu
          mkdir dist && cd dist
          gh release download "$TAG" --pattern 'sorosentinel-scan_*.tar.gz' --repo "$GITHUB_REPOSITORY"
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
      # The attestation is built on GitHub's runner from the archives the build
      # jobs uploaded; their digests come from SHA256SUMS above.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload checksums and the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          cp "$BUNDLE" "dist/sorosentinel-scan_${TAG}.sigstore.json"
          gh release upload "$TAG" dist/SHA256SUMS "dist/sorosentinel-scan_${TAG}.sigstore.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
