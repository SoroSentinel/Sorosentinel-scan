# Attaches prebuilt scan-cli binaries and SHA256SUMS to a GitHub release (#30).
#
# Runs when a release is published, or by hand for an existing tag. Uses only
# the checkout action ci.yml already pins, rustup (which reads
# rust-toolchain.toml) and the gh CLI on the runner, so it adds no dependency.
# Signing, provenance attestations and the sandbox image push are not here yet:
# they need new actions or a registry, which is a separate decision.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Build
        shell: bash
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          rustup target add "$TARGET"
          cargo build --locked --release -p scan-cli --target "$TARGET"
          dir="sorosentinel-scan_${TAG}_${TARGET}"
          mkdir -p "dist/$dir"
          cp "target/$TARGET/release/sorosentinel-scan" LICENSE README.md "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write SHA256SUMS over every attached binary archive
        run: |
          set -eu
          mkdir dist && cd dist
          gh release download "$TAG" --pattern 'sorosentinel-scan_*.tar.gz' --repo "$GITHUB_REPOSITORY"
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
